name: Build Combat Mod Jar

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create NeoForge mod project
        run: |
          mkdir -p src/main/java/com/example/combatmod/client
          mkdir -p src/main/resources/META-INF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.neoforged.net/releases' }
              }
          }
          plugins {
              id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          org.gradle.parallel=true

          minecraft_version=1.21.1
          neo_version=21.1.72
          mod_version=1.0.0
          maven_group=com.example.combatmod
          archives_base_name=combatmod-1.21.1
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'java-library'
              id 'net.neoforged.moddev' version '1.0.21'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(21)

          neoForge {
              version = project.neo_version
              runs {
                  client { client() }
                  server { server() }
              }
              mods {
                  combatmod {
                      sourceSet sourceSets.main
                  }
              }
          }

          sourceSets.main.resources { srcDir 'src/generated/resources' }

          repositories {
              mavenCentral()
          }

          processResources {
              filesMatching('META-INF/neoforge.mods.toml') {
                  expand 'version': project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
              options.release = 21
          }
          EOF

          cat > src/main/resources/META-INF/neoforge.mods.toml <<'EOF'
          modLoader="javafml"
          loaderVersion="[4,)"
          license="MIT"

          [[mods]]
          modId="combatmod"
          version="${version}"
          displayName="Combat Tracker"
          description="Добавляет +2 сердца, отслеживает криты и показывает combat xN с миганием желтый/красный."
          logoFile="icon.png"

          [[dependencies.combatmod]]
          modId="neoforge"
          type="required"
          versionRange="[21.1.0,)"
          ordering="NONE"
          side="BOTH"

          [[dependencies.combatmod]]
          modId="minecraft"
          type="required"
          versionRange="[1.21.1,)"
          ordering="NONE"
          side="BOTH"
          EOF

          cat > src/main/java/com/example/combatmod/CombatMod.java <<'EOF'
          package com.example.combatmod;

          import net.neoforged.fml.common.Mod;
          import net.neoforged.fml.ModContainer;
          import net.neoforged.neoforge.common.NeoForge;
          import net.neoforged.neoforge.event.entity.player.AttackEntityEvent;
          import net.neoforged.neoforge.event.entity.player.PlayerEvent;
          import net.neoforged.bus.api.SubscribeEvent;
          import com.example.combatmod.client.CombatHudRenderer;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          @Mod("combatmod")
          public class CombatMod {
              public static final String MOD_ID = "combatmod";
              public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);
              public static final CombatTracker TRACKER = new CombatTracker();

              public CombatMod(ModContainer container) {
                  NeoForge.EVENT_BUS.register(this);
                  container.getEventBus().addListener(CombatHudRenderer::register);
                  LOGGER.info("CombatMod initialized!");
              }

              @SubscribeEvent
              public void onAttack(AttackEntityEvent event) {
                  if (event.getEntity().level().isClientSide) return;
                  TRACKER.onPlayerAttack(event.getEntity(), event.getTarget());
              }

              @SubscribeEvent
              public void onPlayerLogin(PlayerEvent.PlayerLoggedInEvent event) {
                  TRACKER.applyExtraHearts(event.getEntity());
              }

              @SubscribeEvent
              public void onPlayerClone(PlayerEvent.Clone event) {
                  if (!event.isWasDeath()) return;
                  TRACKER.applyExtraHearts(event.getEntity());
              }
          }
          EOF

          cat > src/main/java/com/example/combatmod/CombatTracker.java <<'EOF'
          package com.example.combatmod;

          import net.minecraft.world.entity.ai.attributes.AttributeModifier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.resources.ResourceLocation;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;

          public class CombatTracker {
              private static final ResourceLocation HEALTH_ID = ResourceLocation.fromNamespaceAndPath("combatmod", "extra_hearts");
              private static final long RESET_TIME_MS = 6000L;

              public static class Data {
                  public int count = 0;
                  public long lastCritTime = 0;
                  public boolean isRed = false;
              }

              private final ConcurrentHashMap<UUID, Data> combatData = new ConcurrentHashMap<>();
              private UUID lastTargetId = null;

              public void onPlayerAttack(Player attacker, Entity target) {
                  if (!(target instanceof Player)) return;
                  if (!isCriticalHit(attacker)) return;

                  UUID id = target.getUUID();
                  Data data = combatData.computeIfAbsent(id, k -> new Data());
                  long now = System.currentTimeMillis();

                  if (now - data.lastCritTime > RESET_TIME_MS) {
                      data.count = 0;
                  }

                  data.count++;
                  data.lastCritTime = now;
                  data.isRed = !data.isRed;
                  lastTargetId = id;
              }

              public Data getDisplayData() {
                  if (lastTargetId == null) return null;
                  Data data = combatData.get(lastTargetId);
                  if (data == null) return null;
                  if (System.currentTimeMillis() - data.lastCritTime > RESET_TIME_MS) {
                      data.count = 0;
                  }
                  return data;
              }

              public String getTargetName() {
                  if (lastTargetId == null) return "";
                  var level = net.minecraft.client.Minecraft.getInstance().level;
                  if (level == null) return "";
                  var player = level.getPlayerByUUID(lastTargetId);
                  return player != null ? player.getName().getString() : "";
              }

              private boolean isCriticalHit(Player player) {
                  return player.fallDistance > 0.0F &&
                         !player.onGround() &&
                         !player.isInWater() &&
                         !player.hasEffect(net.minecraft.world.effect.MobEffects.BLINDNESS) &&
                         !player.isPassenger() &&
                         !player.isSprinting();
              }

              public void applyExtraHearts(Player player) {
                  var attr = player.getAttribute(Attributes.MAX_HEALTH);
                  if (attr == null) return;
                  if (attr.getModifier(HEALTH_ID) == null) {
                      attr.addTransientModifier(new AttributeModifier(
                          HEALTH_ID, 4.0, AttributeModifier.Operation.ADD_VALUE
                      ));
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/combatmod/client/CombatHudRenderer.java <<'EOF'
          package com.example.combatmod.client;

          import com.example.combatmod.CombatMod;
          import com.example.combatmod.CombatTracker.Data;
          import net.minecraft.client.Minecraft;
          import net.neoforged.neoforge.client.event.RenderGuiEvent;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.neoforge.common.NeoForge;

          public class CombatHudRenderer {
              public static void register() {
                  NeoForge.EVENT_BUS.register(new CombatHudRenderer());
              }

              @SubscribeEvent
              public void onRender(RenderGuiEvent.Pre event) {
                  Data data = CombatMod.TRACKER.getDisplayData();
                  if (data == null || data.count == 0) return;

                  String name = CombatMod.TRACKER.getTargetName();
                  if (name.isEmpty()) return;

                  int color = data.isRed ? 0xFF5555 : 0xFFFF55;
                  String text = name + "  combat x" + data.count;

                  var gui = event.getGuiGraphics();
                  Minecraft mc = Minecraft.getInstance();
                  int x = (mc.getWindow().getGuiScaledWidth() - mc.font.width(text)) / 2;
                  int y = 10;

                  gui.drawString(mc.font, text, x, y, color, true);
              }
          }
          EOF

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload finished jar
        uses: actions/upload-artifact@v4
        with:
          name: combatmod-1.21.1-ready-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
