name: Build Combat Counter 1.19 Forge

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Forge mod project
        run: |
          mkdir -p src/main/java/com/combatmod
          mkdir -p src/main/resources/META-INF

          cat > .gitignore <<'EOF'
          build/
          .gradle/
          .idea/
          *.iml
          run/
          out/
          EOF

          cat > settings.gradle <<'EOF'
          rootProject.name = 'combat-counter-1.19'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  maven { url = 'https://maven.minecraftforge.net' }
                  mavenCentral()
              }
              dependencies {
                  classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
              }
          }

          apply plugin: 'net.minecraftforge.gradle'
          apply plugin: 'eclipse'
          apply plugin: 'maven-publish'

          version = '1.0.0'
          group = 'com.combatmod'
          archivesBaseName = 'combat-counter-1.19'

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.19'
              runs {
                  client {
                      workingDirectory project.file('run')
                      property 'forge.logging.markers', 'REGISTRIES'
                      property 'forge.logging.console.level', 'debug'
                      mods {
                          combatcounter {
                              source sourceSets.main
                          }
                      }
                  }
                  server {
                      workingDirectory project.file('run')
                      property 'forge.logging.markers', 'REGISTRIES'
                      property 'forge.logging.console.level', 'debug'
                      mods {
                          combatcounter {
                              source sourceSets.main
                          }
                      }
                  }
              }
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.19-41.1.0'
          }

          jar {
              manifest {
                  attributes([
                      "Specification-Title"     : "combatcounter",
                      "Specification-Vendor"    : "combatmod",
                      "Specification-Version"   : "1",
                      "Implementation-Title"    : project.name,
                      "Implementation-Version"  : project.jar.archiveVersion,
                      "Implementation-Vendor"   : "combatmod",
                      "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
                  ])
              }
          }
          EOF

          cat > src/main/resources/META-INF/mods.toml <<'EOF'
          modLoader="javafml"
          loaderVersion="[41,)"
          license="MIT"

          [[mods]]
          modId="combatcounter"
          version="1.0.0"
          displayName="Combat Counter"
          description='''
          Счётчик критов + лишние сердечка.
          '''

          [[dependencies.combatcounter]]
          modId="forge"
          mandatory=true
          versionRange="[41,)"
          ordering="NONE"
          side="BOTH"

          [[dependencies.combatcounter]]
          modId="minecraft"
          mandatory=true
          versionRange="[1.19,1.20)"
          ordering="NONE"
          side="BOTH"
          EOF

          cat > src/main/resources/pack.mcmeta <<'EOF'
          {
            "pack": {
              "description": "Combat Counter 1.19",
              "pack_format": 9
            }
          }
          EOF

          cat > src/main/java/com/combatmod/CombatCounterMod.java <<'EOF'
          package com.combatmod;

          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.fml.common.Mod;
          import org.apache.logging.log4j.LogManager;
          import org.apache.logging.log4j.Logger;

          @Mod(CombatCounterMod.MODID)
          public class CombatCounterMod {
              public static final String MODID = "combatcounter";
              private static final Logger LOGGER = LogManager.getLogger();

              public CombatCounterMod() {
                  MinecraftForge.EVENT_BUS.register(new CombatTracker());
                  MinecraftForge.EVENT_BUS.register(new HealthBoostHandler());
                  LOGGER.info("Combat Counter 1.19 загружен!");
              }
          }
          EOF

          cat > src/main/java/com/combatmod/CombatTracker.java <<'EOF'
          package com.combatmod;

          import net.minecraft.client.Minecraft;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.player.Player;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.event.entity.player.AttackEntityEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;

          public class CombatTracker {

              private static String lastTargetName = "";
              private static int combatCount = 0;
              private static long lastCritTick = 0;

              public static String getLastTargetName() {
                  return lastTargetName;
              }

              public static int getCombatCount() {
                  return combatCount;
              }

              public static int getColor() {
                  return (combatCount % 2 == 1) ? 0xFFFF00 : 0xFF0000;
              }

              @SubscribeEvent
              public void onAttackEntity(AttackEntityEvent event) {
                  if (!(event.getEntity() instanceof Player)) return;
                  Player player = (Player) event.getEntity();

                  if (!player.level.isClientSide) return;
                  if (!(event.getTarget() instanceof Player)) return;
                  Player target = (Player) event.getTarget();

                  if (isCriticalHit(player)) {
                      String targetName = target.getName().getString();

                      if (!targetName.equals(lastTargetName)) {
                          lastTargetName = targetName;
                          combatCount = 0;
                      }

                      combatCount++;
                      lastCritTick = player.level.getGameTime();
                  }
              }

              @SubscribeEvent
              public void onClientTick(TickEvent.ClientTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) return;

                  Minecraft mc = Minecraft.getInstance();
                  if (mc.player == null || mc.level == null) {
                      if (combatCount > 0) reset();
                      return;
                  }

                  if (combatCount > 0 && mc.level.getGameTime() - lastCritTick >= 120) {
                      reset();
                  }
              }

              private boolean isCriticalHit(Player player) {
                  return player.getAttackStrengthScale(0.5F) > 0.9F
                          && player.getFallDistance() > 0.0F
                          && !player.isOnGround()
                          && !player.onClimbable()
                          && !player.isInWater()
                          && !player.hasEffect(MobEffects.BLINDNESS)
                          && !player.isPassenger()
                          && !player.isSprinting();
              }

              private static void reset() {
                  combatCount = 0;
                  lastTargetName = "";
              }
          }
          EOF

          cat > src/main/java/com/combatmod/CombatHUD.java <<'EOF'
          package com.combatmod;

          import com.mojang.blaze3d.vertex.PoseStack;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.Font;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.RenderGameOverlayEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = "combatcounter", value = Dist.CLIENT)
          public class CombatHUD {

              @SubscribeEvent
              public static void onRenderOverlay(RenderGameOverlayEvent.Post event) {
                  if (event.getType() != RenderGameOverlayEvent.ElementType.ALL) return;

                  Minecraft mc = Minecraft.getInstance();
                  if (mc.player == null) return;
                  if (CombatTracker.getCombatCount() <= 0) return;

                  Font font = mc.font;
                  PoseStack poseStack = event.getMatrixStack();
                  int screenWidth = event.getWindow().getGuiScaledWidth();

                  String targetName = CombatTracker.getLastTargetName();
                  String combatText = "combat x" + CombatTracker.getCombatCount();
                  int color = CombatTracker.getColor();

                  font.drawShadow(poseStack, targetName, 5, 5, color);

                  int textWidth = font.width(combatText);
                  font.drawShadow(poseStack, combatText, screenWidth - textWidth - 5, 5, color);
              }
          }
          EOF

          cat > src/main/java/com/combatmod/HealthBoostHandler.java <<'EOF'
          package com.combatmod;

          import net.minecraft.world.entity.ai.attributes.AttributeInstance;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.player.Player;
          import net.minecraftforge.event.entity.player.PlayerEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;

          public class HealthBoostHandler {

              private static final double BOOSTED_HEALTH = 24.0;

              @SubscribeEvent
              public void onPlayerLogin(PlayerEvent.PlayerLoggedInEvent event) {
                  applyHealthBoost((Player) event.getEntity());
              }

              @SubscribeEvent
              public void onPlayerRespawn(PlayerEvent.PlayerRespawnEvent event) {
                  applyHealthBoost((Player) event.getEntity());
              }

              private void applyHealthBoost(Player player) {
                  if (player.level.isClientSide) return;
                  AttributeInstance maxHealth = player.getAttribute(Attributes.MAX_HEALTH);
                  if (maxHealth != null) {
                      maxHealth.setBaseValue(BOOSTED_HEALTH);
                  }
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload finished jar
        uses: actions/upload-artifact@v4
        with:
          name: combat-counter-1.19-forge-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
